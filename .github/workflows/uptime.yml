
name: Automated Uptime Monitoring

on:
  workflow_dispatch:

permissions:
  contents: write

# Pages deploymentとは別のグループにする
concurrency:
  group: uptime-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run monitoring script
        env:
          MONITOR_API_KEY: ${{ secrets.MONITOR_API_KEY }}
        run: python monitor.py

      - name: Commit and Push metrics JSON
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if [ -f metrics.json ]; then
            git add metrics.json

            if ! git diff --cached --quiet; then
              git commit -m "chore: update uptime metrics [skip ci]"
              git pull --rebase origin "${GITHUB_REF_NAME}"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            else
              echo "No changes in metrics."
            fi
          else
            echo "metrics.json was not generated."
            exit 1
          fi

      - name: Check execution location
        run: |
          echo "Runner OS: $RUNNER_OS"
          echo "Runner Name: $RUNNER_NAME"
          echo "Runner Region: ${GITHUB_REGION:-Unknown}"
          echo "Runner IP:"
          curl -fsS --max-time 15 https://ipinfo.io/json || echo "IP lookup failed"
