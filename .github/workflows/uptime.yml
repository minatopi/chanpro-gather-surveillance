name: Automated Uptime Monitoring

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run monitoring script
        run: python monitor.py

      - name: Commit and Push metrics JSON
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if [ ! -f metrics.json ] || ! git diff --exit-code metrics.json; then
            git add metrics.json
            git commit -m "chore: update uptime metrics [skip ci]"
            git push
          else
            echo "No changes in metrics."
          fi
      - name: Check execution location
        run: |
          echo "Runner OS: $RUNNER_OS"
          echo "Runner Name: $RUNNER_NAME"
          echo "Runner Region: $GITHUB_REGION"
          echo "Runner IP:"
          curl -s https://ipinfo.io/json
