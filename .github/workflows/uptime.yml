name: Automated Uptime Monitoring

on:
 # schedule:
    # 30分ごとに実行（毎時0分と30分にトリガーされます）
   # - cron: '0,30 * * * *'
  
  # 手動実行をより確実に有効化するための明示的な記述
  workflow_dispatch: {}

permissions:
  contents: write # metrics.jsonを更新・プッシュするために必須

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run monitoring script
      run: python monitor.py

    - name: Commit and Push metrics JSON
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # metrics.jsonが存在しない、または変更がある場合のみ処理
        if [ ! -f metrics.json ] || ! git diff --exit-code metrics.json; then
          git add metrics.json
          git commit -m "chore: update uptime metrics [skip ci]"
          git push
        else
          echo "No changes in metrics."
        fi
