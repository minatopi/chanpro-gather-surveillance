name: Automated Uptime Monitoring

on:
  schedule:
    # 30分ごとに実行（毎時0分と30分）
    - cron: '0,30 * * * *'
  workflow_dispatch: # 手動実行を有効化（構文自体はこれで正しいです）

permissions:
  contents: write # 変更をプッシュするために必須

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run monitoring script
      run: python monitor.py

    - name: Commit and Push metrics JSON
      run: |
        git config --local user.email "github-actions[bot]@://github.com"
        git config --local user.name "github-actions[bot]"
        
        # ファイルが存在しない、または変更がある場合のみコミット
        if [ ! -f metrics.json ] || ! git diff --exit-code metrics.json; then
          git add metrics.json
          git commit -m "chore: update uptime metrics [skip ci]"
          git push
        else
          echo "No changes in metrics."
        fi
