name: Automated Uptime Monitoring

on:
  schedule:
    # 5分ごとに実行（GitHubの混雑具合により多少前後します）
    - cron: '*/30 * * * *'
  workflow_dispatch: # 手動実行も可能にする

permissions:
  contents: write # リポジトリにJSONをプッシュするために必要

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run monitoring script
      run: python monitor.py

    - name: Commit and Push metrics JSON
      run: |
        git config --local user.email "github-actions[bot]@://github.com"
        git config --local user.name "github-actions[bot]"
        
        # 変更（metrics.json）がある場合のみコミットしてプッシュ
        if ! git diff --exit-code metrics.json; then
          git add metrics.json
          git commit -m "chore: update uptime metrics [skip ci]"
          git push
        else
          echo "No changes in metrics."
        fi
